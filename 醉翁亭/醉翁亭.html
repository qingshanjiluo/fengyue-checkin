<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>醉翁亭 · 酒馆交易站</title>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* 基础重置与字体 */
body {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  background-color: #F5F0E8;
  color: #2C2A28;
  overflow-x: hidden;
}
.font-brush { font-family: 'Ma Shan Zheng', cursive; }
.font-serif { font-family: 'Noto Serif SC', serif; }
.font-lora { font-family: 'Lora', serif; }

/* 宣纸纹理背景 */
.rice-paper {
  background-color: #F5F0E8;
  position: relative;
}
.rice-paper::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.7;
}

/* 竹影绿背景 */
.bamboo-bg { background-color: #E8EDE4; }

/* 墨迹淡入 */
@keyframes inkFadeIn {
  from { opacity: 0; transform: translateY(12px); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.ink-fade {
  animation: inkFadeIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* 印章盖章效果 */
@keyframes sealDrop {
  0% { opacity: 0; transform: scale(2) rotate(-10deg); }
  60% { opacity: 1; transform: scale(0.9) rotate(2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}
.seal-stamp {
  animation: sealDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

/* 按钮按压回弹 */
.btn-seal {
  transition: transform 0.15s ease, box-shadow 0.3s ease;
}
.btn-seal:active {
  transform: scale(0.96);
}

/* 卡片毛边效果 */
.card-deckle {
  border-radius: 2px 3px 4px 2px / 3px 2px 3px 4px;
  box-shadow: 0 4px 20px rgba(44,42,40,0.06), 0 1px 3px rgba(44,42,40,0.04);
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.6s ease;
}
.card-deckle:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(44,42,40,0.1), 0 2px 6px rgba(44,42,40,0.06);
}

/* 输入框笺纸样式 */
.input-scroll {
  background: rgba(255,255,255,0.5);
  border: 1px solid #E0D6C8;
  border-radius: 2px;
  box-shadow: inset 0 1px 3px rgba(44,42,40,0.04);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.input-scroll:focus {
  outline: none;
  border-color: #C49B6C;
  box-shadow: inset 0 1px 3px rgba(44,42,40,0.04), 0 0 0 3px rgba(196,155,108,0.1);
}

/* 页面切换 */
.page-enter {
  animation: inkFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

/* 山水背景动画 */
@keyframes mountainFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.mountain-float { animation: mountainFloat 8s ease-in-out infinite; }

/* 飞鸟掠过 */
@keyframes birdFly {
  0% { transform: translateX(-120px) translateY(20px); opacity: 0; }
  20% { opacity: 0.6; }
  80% { opacity: 0.6; }
  100% { transform: translateX(calc(100vw + 120px)) translateY(-10px); opacity: 0; }
}
.bird-fly {
  animation: birdFly 20s linear infinite;
  animation-delay: 3s;
}

/* 自定义滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #E0D6C8; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #C49B6C; }

/* 选中文字颜色 */
::selection { background: rgba(196,155,108,0.25); color: #2C2A28; }
</style>
<script>
tailwind.config = {

        'serif': ['"Noto Serif SC"', 'serif'],
        'lora': ['Lora', 'serif'],
      }

}
</script>

/* ==================== 印章组件 ==================== */
const SealStamp = ({ text, show, onDone }) => {
  useEffect(() => {
    if (show) {
      const timer = setTimeout(onDone, 1500);
      return () => clearTimeout(timer);
    }
  }, [show]);
  if (!show) return null;
  return (
    <div className="fixed inset-0 z-[9999] flex items-center justify-center pointer-events-none">
      <div className="seal-stamp w-32 h-32 rounded-full border-4 border-cinnabar/80 flex items-center justify-center bg-rice/10 backdrop-blur-sm">
        <div className="w-28 h-28 rounded-full border-2 border-cinnabar/40 flex items-center justify-center">
          <span className="font-brush text-3xl text-cinnabar/90 select-none">{text}</span>
        </div>
      </div>
    </div>
  );
};

/* ==================== 导航栏 ==================== */
const Navbar = ({ currentPage, setPage }) => {

        {/* Mobile Menu Button */}

/* ==================== 商品详情页 ==================== */
const ProductDetailPage = ({ setPage }) => {

  return (
    <div className="page-enter max-w-4xl mx-auto px-6 py-10">
      <button onClick={() => setPage('list')} className="flex items-center gap-2 text-ink-light hover:text-amber transition-colors duration-300 mb-8 font-serif text-sm tracking-widest">

      <div className="grid grid-cols-1 md:grid-cols-2 gap-10">

/* ==================== App ==================== */
const App = () => {
  const [currentPage, setPage] = useState('home');

  // 页面切换时滚动到顶部
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [currentPage]);

  const renderPage = () => {
    switch (currentPage) {
      case 'home': return <HomePage setPage={setPage} />;
      case 'list': return <ProductListPage setPage={setPage} />;
      case 'detail': return <ProductDetailPage setPage={setPage} />;
      case 'publish': return <PublishPage setPage={setPage} />;
      case 'wallet': return <WalletPage setPage={setPage} />;
      default: return <HomePage setPage={setPage} />;
    }
  };

  return (
    <div className="min-h-screen flex flex-col">
      <Navbar currentPage={currentPage} setPage={setPage} />
      <main className="flex-1">
        {renderPage()}
      </main>
      <Footer />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
