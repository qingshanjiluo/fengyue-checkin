const { useState, useEffect, useRef } = React;

/* ==================== API ==================== */
const API = 'https://zuiweng-api.sifangzhiji.workers.dev';
const getToken = () => localStorage.getItem('zw_token') || '';
const getUser = () => { try { return JSON.parse(localStorage.getItem('zw_user') || 'null'); } catch { return null; } };

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(getToken() ? { Authorization: 'Bearer ' + getToken() } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.message || ('HTTP ' + res.status));
  return j.data;
}
const PLATFORM_LABELS = { aimagnet: '春水酒馆', fengyue: '风月酒馆', missai: '密丝AI', dzmm: 'DZMM' };
const PLATFORM_UNITS = { aimagnet: '花瓣', fengyue: '积分', missai: '体验点', dzmm: '积分' };
const CONV_RATE = 1000;   // 花瓣/积分 -> 代币 汇率
const QQ_GROUP = '醉翁亭充值群';   // 充值群提示, 阶段2改为 settings 配置
const RECHARGE_PACKAGES = [       // 充值套餐: rmb = 人民币金额, bonus = 赠送代币
  { rmb: 10, bonus: 0 },
  { rmb: 30, bonus: 20 },
  { rmb: 50, bonus: 50 },
  { rmb: 100, bonus: 120 },
  { rmb: 200, bonus: 300 },
];
const fmt = (n) => (Number(n) || 0).toLocaleString('zh-CN');
const fmtTime = (u) => {
  if (!u) return '—';
  if (/^\d+$/.test(String(u)) && String(u).length === 10) return new Date(Number(u) * 1000).toLocaleDateString('zh-CN');
  const t = new Date(String(u).replace(' ', 'T'));
  return isNaN(t) ? String(u) : t.toLocaleString('zh-CN');
};

const SealStamp = ({ text, show, onDone }) => {
  useEffect(() => {
    if (show) { const timer = setTimeout(onDone, 1500); return () => clearTimeout(timer); }
  }, [show]);
  if (!show) return null;
  return (
    <div className="fixed inset-0 z-[9999] flex items-center justify-center pointer-events-none">
      <div className="seal-stamp w-32 h-32 rounded-full border-4 border-cinnabar/80 flex items-center justify-center bg-rice/10 backdrop-blur-sm">

};

/* ==================== 登录 / 注册 ==================== */
const LoginPage = ({ onAuthed }) => {
  const [mode, setMode] = useState('login');
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg('');
    try {
      if (mode === 'login') {
        const d = await api('POST', '/api/auth/login', { username, password });
        localStorage.setItem('zw_token', d.token);
        localStorage.setItem('zw_user', JSON.stringify(d.user));
        onAuthed(d.user);
      } else {
        await api('POST', '/api/auth/register', { username, password });
        setMode('login'); setMsg('注册成功，请登栈');
      }
    } catch (e) { setMsg(e.message); }
    setBusy(false);
  };

  return (
    <div className="page-enter max-w-md mx-auto px-6 py-16">
      <div className="text-center mb-10">
        <h2 className="font-brush text-4xl text-ink mb-3">{mode === 'login' ? '登栈' : '入亭'}</h2>
        <p className="font-serif text-sm text-ink-light tracking-widest">{mode === 'login' ? '有信物者，方入此门' : '注册一枚亭内信物'}</p>
      </div>
      <div className="bg-white/40 border border-tea-border p-8 relative">
        <div className="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-amber/20"></div>
        <div className="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-amber/20"></div>
        <div className="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-amber/20"></div>
        <div className="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-amber/20"></div>
        <div className="space-y-5">
          <div>
            <label className="block font-serif text-sm text-ink-light mb-2 tracking-widest">名号</label>
            <input value={username} onChange={e => setUsername(e.target.value)} placeholder="你的名号..." className="input-scroll w-full px-4 py-3 font-serif text-ink placeholder:text-ink-light/40" />
          </div>
          <div>
            <label className="block font-serif text-sm text-ink-light mb-2 tracking-widest">密语</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="口令（至少 6 位）" className="input-scroll w-full px-4 py-3 font-serif text-ink placeholder:text-ink-light/40" />
          </div>
          {msg && <p className="font-serif text-sm text-cinnabar">{msg}</p>}
          <button onClick={submit} disabled={busy}
            className="btn-seal w-full py-3.5 bg-amber text-white font-serif tracking-[0.3em] text-center hover:bg-amber/90 transition-colors duration-300 shadow-sm disabled:opacity-60">
            {busy ? '稍候...' : (mode === 'login' ? '登栈' : '注册')}
          </button>
          <button onClick={() => setMode(mode === 'login' ? 'register' : 'login')}
            className="w-full text-center font-serif text-sm text-ink-light hover:text-amber tracking-widest">
            {mode === 'login' ? '尚未入亭？注册一枚信物' : '已有信物？返回登栈'}
          </button>
        </div>
      </div>
    </div>
  );
};

const ProductDetailPage = ({ id, setPage, user, onAuthed, onBuy }) => {

  const [seal, setSeal] = useState(null);
  const [delivered, setDelivered] = useState(null);

  useEffect(() => {
    const p = (user ? api('GET', '/api/products') : Promise.resolve({ products: [] }))
      .then(d => {
        const found = (d.products || []).find(x => x.id === Number(id));
        if (found) setInfo(found);
        else setErr('该号已售出或不存在');

/* ==================== 号池监看（管理端） ==================== */
const PoolAdminPage = () => {
  const [stats, setStats] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const [users, setUsers] = useState([]);
  const [q, setQ] = useState('');
  const [status, setStatus] = useState('');
  const [platform, setPlatform] = useState('');
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');
  const [chargeUid, setChargeUid] = useState('');
  const [chargeAmt, setChargeAmt] = useState('');

  const load = async () => {
    try {
      const sp = platform ? '?platform=' + encodeURIComponent(platform) : '';
      const s = await api('GET', '/api/admin/chunshui/stats' + sp);
      setStats(s);
      const params = new URLSearchParams();
      if (status) params.set('status', status);
      if (platform) params.set('platform', platform);
      if (q) params.set('q', q);
      const qs = params.toString();
      const d = await api('GET', '/api/admin/chunshui/accounts' + (qs ? '?' + qs : ''));
      setAccounts(d.accounts || []);
      const u = await api('GET', '/api/admin/users');
      setUsers(u.users || []);
      setErr('');
    } catch (e) { setErr(e.message); }
  };

  useEffect(() => { load(); }, [status, q, platform]);

  const platTabs = Array.from(new Set(['', ...Object.keys(PLATFORM_LABELS), ...accounts.map(a => a.platform || '')])).filter(Boolean);

  const patch = async (id, body) => {
    try { await api('PATCH', `/api/admin/chunshui/accounts/${id}`, body); setMsg('已更新'); load(); } catch (e) { setMsg(e.message); }
  };
  const patchUser = async (id, body) => {
    try { await api('PATCH', `/api/admin/users/${id}`, body); setMsg('用户已更新'); load(); } catch (e) { setMsg(e.message); }
  };
  const charge = async () => {
    try {
      const d = await api('POST', '/api/admin/charge', { user_id: Number(chargeUid), amount: Number(chargeAmt), note: '亭主充值' });
      setMsg(`充值成功，余额 ${d.balance} 枚`); setChargeUid(''); setChargeAmt('');
    } catch (e) { setMsg(e.message); }
  };

  const card = (label, value, color) => (
    <div className="bg-white/40 border border-tea-border p-5">
      <p className="font-serif text-xs text-ink-light tracking-widest mb-1">{label}</p>
      <p className={`font-lora text-2xl font-semibold ${color || 'text-ink'}`}>{fmt(value)}</p>
    </div>
  );

  return (
    <div className="page-enter max-w-6xl mx-auto px-6 py-10">
      <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
        <div>
          <h2 className="font-brush text-4xl text-ink mb-2">春水号池</h2>
          <p className="font-serif text-sm text-ink-light tracking-widest">监看全部春水号的健康与花瓣，向用户充值</p>
        </div>
        {msg && <p className="font-serif text-sm text-amber">{msg}</p>}
        {err && <p className="font-serif text-sm text-cinnabar">{err}</p>}
      </div>

      {stats && (
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
          {card('号池总数', stats.total)}
          {card('在售库存', stats.pool, 'text-amber')}
          {card('已售出', stats.sold)}
          {card('异常/掉线', stats.dead, stats.dead > 0 ? 'text-cinnabar' : 'text-ink')}
          {card('花瓣总和', stats.totalPetals, 'text-amber')}
          {card('今日签到', stats.signedToday, 'text-green-700')}
        </div>
      )}

      <div className="flex flex-col md:flex-row gap-4 mb-6">
        <div className="flex items-center gap-2 flex-wrap">
          <button onClick={() => setPlatform('')} className={`px-4 py-2 font-serif text-sm tracking-widest border transition-colors ${!platform ? 'bg-amber text-white border-amber' : 'border-tea-border text-ink-light hover:border-amber hover:text-amber'}`}>全部平台</button>
          {platTabs.map(x => (
            <button key={x} onClick={() => setPlatform(x)} className={`px-4 py-2 font-serif text-sm tracking-widest border transition-colors ${platform === x ? 'bg-amber text-white border-amber' : 'border-tea-border text-ink-light hover:border-amber hover:text-amber'}`}>{PLATFORM_LABELS[x] || x}</button>
          ))}
        </div>
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="搜索昵称或邮箱..." className="input-scroll px-4 py-2.5 font-serif text-ink flex-1" />
        <select value={status} onChange={e => setStatus(e.target.value)} className="input-scroll px-4 py-2.5 font-serif text-ink bg-transparent">
          <option value="">全部状态</option>
          <option value="pool">库存</option>
          <option value="sold">已售</option>
          <option value="disabled">停用</option>
        </select>
        <button onClick={load} className="px-6 py-2.5 border border-tea-border font-serif text-sm text-ink-light hover:border-amber hover:text-amber tracking-widest">刷新</button>
      </div>

      <div className="bg-white/30 border border-tea-border overflow-x-auto">
        <table className="w-full text-sm font-serif">
          <thead>
            <tr className="border-b border-tea-border text-ink-light text-xs tracking-widest">
              <th className="px-4 py-3 text-left">ID</th>

/* ==================== 账号市场 ==================== */
const MarketPage = ({ setPage, user, onBuy }) => {
  const [products, setProducts] = useState([]);
  const [plat, setPlat] = useState('');
  const [err, setErr] = useState('');
  const [buyTarget, setBuyTarget] = useState(null);
  const [delivered, setDelivered] = useState(null);
  const [busy, setBusy] = useState(false);
  const [seal, setSeal] = useState(null);

  const load = () => api('GET', '/api/products').then(d => setProducts(d.products || [])).catch(e => setErr(e.message));
  useEffect(() => { load(); }, []);
  useEffect(() => { if (delivered) onBuy(); }, [delivered]);

  const list = plat ? products.filter(p => p.platform === plat) : products;

  const doBuy = async () => {
    if (!user) { setPage('login'); return; }
    setBusy(true); setErr('');
    try {
      const d = await api('POST', '/api/orders', { account_id: Number(buyTarget.id) });
      setDelivered(d.account);
      setSeal('已收');
      setBuyTarget(null);
      load();
    } catch (e) {
      setErr(e.message);
      if (e.message.includes('代币')) setBuyTarget(null);
    }
    setBusy(false);
  };

  return (
    <div className="page-enter max-w-6xl mx-auto px-6 py-10">
      <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-10">
        <div>
          <h2 className="font-brush text-4xl text-ink mb-2">账号市场</h2>
          <p className="font-serif text-sm text-ink-light tracking-widest">各渠道每日签到照养的号，以代币购得</p>
        </div>
        <div className="flex items-center gap-4">
          <select value={plat} onChange={e => setPlat(e.target.value)} className="input-scroll px-4 py-2.5 font-serif">
            <option value="">全部平台</option>
            {Object.entries(PLATFORM_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
          {user && (
            <span className="flex items-center gap-1.5 font-serif text-sm text-ink-light">
              <IconCoin className="w-4 h-4 text-amber" />{fmt(user.balance)} 代币
            </span>
          )}
        </div>
      </div>
      {err && <p className="font-serif text-sm text-cinnabar mb-6">{err}</p>}
      {!err && list.length === 0 && (
        <div className="text-center py-20">
          <IconScroll className="w-16 h-16 text-ink-light/20 mx-auto mb-4" />
          <p className="font-serif text-ink-light tracking-widest">暂无在售账号，稍后再来</p>
        </div>
      )}
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {list.map((p, i) => (
          <div key={p.id} className="card-deckle bg-white/50 border border-tea-border p-6 group ink-fade" style={{ animationDelay: `${i * 0.08}s`, opacity: 0 }}>
            <div className="flex items-start justify-between mb-4">
              <span className="px-2.5 py-1 text-xs font-serif border border-amber/40 text-amber bg-amber/5">{PLATFORM_LABELS[p.platform] || p.platform}</span>
              <span className="text-xs text-ink-light font-serif">#{p.id}</span>
            </div>
            <h3 className="font-serif text-lg text-ink mb-1 truncate">{p.nickname}</h3>
            <p className="text-xs text-ink-light font-serif mb-4">{(PLATFORM_UNITS[p.platform] || '积分')} {fmt(p.petals)} · 入亭于 {fmtTime(p.registered_at)}</p>
            <div className="flex items-center justify-between">
              <span className="font-lora text-xl font-semibold text-cinnabar">{fmt(p.price)} 代币</span>
              <button onClick={() => setBuyTarget(p)} className="px-4 py-2 bg-amber text-white font-serif text-sm tracking-widest hover:bg-amber/90 transition-colors">购取</button>
            </div>
          </div>
        ))}
      </div>

      {buyTarget && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-ink/40 backdrop-blur-sm p-4" onClick={() => setBuyTarget(null)}>
          <div className="bg-rice border border-tea-border max-w-sm w-full p-8" onClick={e => e.stopPropagation()}>
            <h3 className="font-brush text-2xl text-ink mb-4">确认购取</h3>
            <p className="font-serif text-sm text-ink-light mb-1">{buyTarget.nickname} · {PLATFORM_LABELS[buyTarget.platform] || buyTarget.platform}</p>
            <p className="font-lora text-2xl text-cinnabar mb-2">{fmt(buyTarget.price)} 代币</p>
            {user ? (
              <p className="font-serif text-xs text-ink-light mb-6">余钱 {fmt(user.balance)} 代币</p>
            ) : (
              <p className="font-serif text-xs text-ink-light mb-6">尚未登栈，将跳转登栈</p>
            )}
            <div className="flex gap-3">
              <button onClick={() => setBuyTarget(null)} className="flex-1 py-2.5 border border-tea-border font-serif text-sm text-ink-light hover:text-ink">再想想</button>
              <button onClick={doBuy} disabled={busy} className="flex-1 py-2.5 bg-amber text-white font-serif text-sm tracking-widest hover:bg-amber/90 disabled:opacity-60">{busy ? '办理中...' : (user ? '确认购取' : '去登栈')}</button>
            </div>
          </div>
        </div>
      )}

      {delivered && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-ink/40 backdrop-blur-sm p-4">
          <div className="bg-rice border border-tea-border max-w-md w-full p-8">
            <p className="font-brush text-3xl text-ink mb-2 text-center">号已交付</p>
            <p className="font-serif text-sm text-ink-light text-center tracking-widest mb-8">请记下登录信物，妥善保管</p>
            <div className="bg-bamboo/40 border border-tea-border p-6 space-y-3 text-left mb-6">
              <div className="flex justify-between"><span className="text-ink-light font-serif text-sm">昵称</span><span className="font-serif text-ink break-all text-right">{delivered.nickname}</span></div>
              <div className="flex justify-between"><span className="text-ink-light font-serif text-sm">账号</span><span className="font-serif text-ink break-all text-right">{delivered.email}</span></div>
              <div className="flex justify-between"><span className="text-ink-light font-serif text-sm">密语</span><span className="font-serif text-ink break-all text-right">{delivered.password}</span></div>
              <div className="flex justify-between"><span className="text-ink-light font-serif text-sm">积分</span><span className="font-lora text-ink">{fmt(delivered.petals)}</span></div>
            </div>
            <button onClick={() => { setDelivered(null); }} className="w-full py-2.5 bg-amber text-white font-serif tracking-widest hover:bg-amber/90">收讫</button>
          </div>
        </div>
      )}

      <SealStamp text={seal} show={!!seal} onDone={() => setSeal(null)} />
    </div>
  );
};

const RechargePage = ({ user, setPage }) => {
  const [rate, setRate] = useState(100);

  const [orders, setOrders] = useState([]);

  const load = () => {
    api('GET', '/api/stats').then(d => { setRate(d.token_per_rmb || 100); if (d.qq_group) setQq(d.qq_group); }).catch(() => {});
    if (user) api('GET', '/api/recharge/orders').then(d => setOrders(d.orders || [])).catch(() => {});
  };
  useEffect(() => { load(); }, [user]);

  const createOrder = async (pkg) => {
    setBusy(true); setErr('');

      const d = await api('POST', '/api/recharge', { amount_rmb: pkg.rmb, bonus: pkg.bonus });
      setCreated(d);
      load();
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const copy = (text, key) => {

            <div className="flex justify-between"><span className="text-sm text-ink-light font-serif">金额</span><span className="font-serif text-ink">{created.amount_rmb} 元</span></div>
            <div className="flex justify-between"><span className="text-sm text-ink-light font-serif">应到账</span><span className="font-lora text-amber">{fmt(created.token_amount)} 代币</span></div>
          </div>
          <div className="flex gap-3 flex-wrap">
            <button onClick={() => copy(note(created), 'note')} className="px-5 py-2.5 border border-tea-border font-serif text-sm text-ink-light hover:border-amber hover:text-amber transition-colors">{copied === 'note' ? '已复制备注' : '复制订单备注'}</button>
            <button onClick={() => setCreated(null)} className="px-5 py-2.5 font-serif text-sm text-ink-light hover:text-ink">关闭</button>
          </div>
        </div>
      )}

      <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        {RECHARGE_PACKAGES.map(pkg => (
          <div key={pkg.rmb} className="card-deckle bg-white/50 border border-tea-border p-6 text-center group">
            <p className="font-lora text-3xl font-semibold text-ink">{pkg.rmb} 元</p>
            <p className="font-lora text-lg text-amber my-3">{fmt(pkg.rmb * rate + pkg.bonus)} 代币</p>

            {rows.map((r, i) => (
              <tr key={r.platform} className="hover:bg-white/20 transition-colors align-middle">
                <td className="px-4 py-3 whitespace-nowrap text-ink">{r.label || r.platform}</td>
                <td className="px-4 py-3 text-center">
                  <input type="checkbox" checked={!!r.enabled} onChange={e => set(i, 'enabled', e.target.checked ? 1 : 0)} />

  );
};

    try { await api('DELETE', `/api/admin/notifications/${id}`); load(); }

          <tbody className="divide-y divide-tea-border/50">
            {orders.map(o => (
              <tr key={o.id} className="hover:bg-white/20 transition-colors align-middle">
                <td className="px-4 py-3 text-ink break-all">{o.order_no}</td>
                <td className="px-4 py-3 whitespace-nowrap">{o.username || ('#' + o.user_id)}</td>
                <td className="px-4 py-3 text-right font-lora">{o.amount_rmb} 元</td>
                <td className="px-4 py-3 text-right font-lora text-amber">{fmt(o.token_amount)}</td>
                <td className="px-4 py-3 text-center">
                  <span className={`px-2 py-0.5 text-xs border ${o.status === 'done' ? 'border-amber/40 text-amber' : o.status === 'rejected' ? 'border-cinnabar/40 text-cinnabar' : 'border-tea-border text-ink-light'}`}>{ST[o.status] || o.status}</span>
                </td>
                <td className="px-4 py-3 text-right text-ink-light whitespace-nowrap">{fmtTime(o.created_at)}</td>
                <td className="px-4 py-3 text-center whitespace-nowrap">
                  {o.status === 'pending' && (
                    <div className="flex gap-2 justify-center">
                      <button onClick={() => handle(o.id, 'done')} className="px-3 py-1.5 text-xs font-serif bg-amber text-white hover:bg-amber/90 tracking-wider">确认到账</button>
                      <button onClick={() => handle(o.id, 'rejected')} className="px-3 py-1.5 text-xs font-serif border border-cinnabar/40 text-cinnabar hover:bg-cinnabar/5 tracking-wider">拒绝</button>
                    </div>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {orders.length === 0 && <div className="px-6 py-12 text-center font-serif text-sm text-ink-light">暂无订单</div>}
      </div>
    </div>
  );
};

/* ==================== App ==================== */
const App = () => {
  const [currentPage, setPage] = useState('home');
  const [pageParam, setPageParam] = useState(null);
  const [user, setUser] = useState(getUser());

  const go = (page, param) => { setPage(page); setPageParam(param); };
  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [currentPage]);

  const onAuthed = (u) => { setUser(u); refreshUser(); setPage('home'); };
  const onLogout = () => { localStorage.removeItem('zw_token'); localStorage.removeItem('zw_user'); setUser(null); setPage('home'); };
  const refreshUser = () => {
    if (getToken()) api('GET', '/api/wallet').then(d => { localStorage.setItem('zw_user', JSON.stringify(d.user)); setUser(d.user); }).catch(() => {});
  };

  const renderPage = () => {
    switch (currentPage) {
      case 'login': return <LoginPage onAuthed={onAuthed} />;
      case 'home': return <HomePage setPage={go} user={user} />;
      case 'market': return <MarketPage setPage={go} user={user} onBuy={refreshUser} />;
      case 'me': return <MePage user={user} setPage={go} onRefresh={refreshUser} />;
      case 'recharge': return <RechargePage user={user} setPage={go} />;
      case 'invite': return <InvitePage user={user} />;
      case 'scripts': return <PlaceholderPage title="脚本与皮肤" desc="各路脚本、皮肤与行囊，皆可在此寻得" />;
      case 'players': return <PlaceholderPage title="玩家市场" desc="玩家之间的号、物与约定在此流通" />;
      case 'chat': return <PlaceholderPage title="聊天室" desc="亭中诸客共叙闲话" />;
      case 'list': return <ProductListPage setPage={go} user={user} onBuy={refreshUser} />;
      case 'detail': return <ProductDetailPage id={pageParam && pageParam.id} setPage={go} user={user} onBuy={refreshUser} />;
      case 'wallet': return <WalletPage user={user} setPage={go} />;
      case 'pool': return <PoolAdminPage />;
      case 'chlogs': return <ChannelLogsAdminPage />;
      case 'orders': return <OrdersAdminPage />;
      case 'admin-channels': return <ChannelsAdminPage />;
      case 'admin-notices': return <NoticesAdminPage />;
      case 'admin-settings': return <SettingsAdminPage />;
      default: return <HomePage setPage={go} user={user} />;
    }
  };

  return (
    <div className="min-h-screen flex flex-col">
      <Navbar currentPage={currentPage} setPage={go} user={user} onLogout={onLogout} />
      <main className="flex-1">{renderPage()}</main>
      <footer className="border-t border-tea-border mt-20 py-10 text-center">
        <div className="flex items-center justify-center gap-4 mb-4">
          <span className="h-px w-8 bg-amber/30"></span>
          <IconPavilion className="w-5 h-5 text-ink-light/40" />
          <span className="h-px w-8 bg-amber/30"></span>
        </div>
        <p className="font-serif text-xs text-ink-light/40 tracking-[0.2em]">醉翁亭 · 春水雅集 · GitHub Actions × Cloudflare D1</p>
      </footer>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
