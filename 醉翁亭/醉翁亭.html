<style>

.font-lora { font-family: 'Lora', serif; }
.rice-paper {
  background-color: #F5F0E8;
  position: relative;
}
.rice-paper::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");

  z-index: 9999;
  opacity: 0.7;
}
.bamboo-bg { background-color: #E8EDE4; }
@keyframes inkFadeIn {

}
.ink-fade { animation: inkFadeIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes sealDrop {
  0% { opacity: 0; transform: scale(2) rotate(-10deg); }
  60% { opacity: 1; transform: scale(0.9) rotate(2deg); }

  box-shadow: 0 4px 20px rgba(44,42,40,0.06), 0 1px 3px rgba(44,42,40,0.04);
  transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.6s ease;

.card-deckle:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(44,42,40,0.1), 0 2px 6px rgba(44,42,40,0.06);
}
.input-scroll {
  background: rgba(255,255,255,0.5);
  border: 1px solid #E0D6C8;
  border-radius: 2px;
  box-shadow: inset 0 1px 3px rgba(44,42,40,0.04);
  transition: border-color 0.3s, box-shadow 0.3s;

.input-scroll:focus {

  border-color: #C49B6C;
  box-shadow: inset 0 1px 3px rgba(44,42,40,0.04), 0 0 0 3px rgba(196,155,108,0.1);
}
.page-enter { animation: inkFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes mountainFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.mountain-float { animation: mountainFloat 8s ease-in-out infinite; }
@keyframes birdFly {
  0% { transform: translateX(-120px) translateY(20px); opacity: 0; }
  20% { opacity: 0.6; }
  80% { opacity: 0.6; }
  100% { transform: translateX(calc(100vw + 120px)) translateY(-10px); opacity: 0; }
}
.bird-fly { animation: birdFly 20s linear infinite; animation-delay: 3s; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #E0D6C8; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #C49B6C; }
::selection { background: rgba(196,155,108,0.25); color: #2C2A28; }

tailwind.config = {

    fontFamily: {

}

<body class="rice-paper min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ==================== API ==================== */
const API = 'https://zuiweng-api.sifangzhiji.workers.dev';
const getToken = () => localStorage.getItem('zw_token') || '';
const getUser = () => { try { return JSON.parse(localStorage.getItem('zw_user') || 'null'); } catch { return null; } };

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(getToken() ? { Authorization: 'Bearer ' + getToken() } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.message || ('HTTP ' + res.status));
  return j.data;
}
const PLATFORM_LABELS = { aimagnet: '春水酒馆', fengyue: '风月酒馆', missai: '密丝AI', dzmm: 'DZMM' };
const PLATFORM_UNITS = { aimagnet: '花瓣', fengyue: '积分', missai: '体验点', dzmm: '积分' };
const CONV_RATE = 1000;   // 花瓣/积分 -> 代币 汇率
const fmt = (n) => (Number(n) || 0).toLocaleString('zh-CN');
const fmtTime = (u) => {
  if (!u) return '—';
  if (/^\d+$/.test(String(u)) && String(u).length === 10) return new Date(Number(u) * 1000).toLocaleDateString('zh-CN');
  const t = new Date(String(u).replace(' ', 'T'));
  return isNaN(t) ? String(u) : t.toLocaleString('zh-CN');
};

    <circle cx="12" cy="12" r="9"/><path d="M12 7 V17"/><path d="M9 10 H12"/><path d="M9 14 H15"/>
  </svg>
);
const IconUser = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 20 C4 16 8 14 12 14 C16 14 20 16 20 20"/>

);
const IconShield = ({ className }) => (

const IconClock = ({ className }) => (

);
const IconArrowLeft = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">

const SealStamp = ({ text, show, onDone }) => {
  useEffect(() => {
    if (show) { const timer = setTimeout(onDone, 1500); return () => clearTimeout(timer); }
  }, [show]);
  if (!show) return null;
  return (
    <div className="fixed inset-0 z-[9999] flex items-center justify-center pointer-events-none">
      <div className="seal-stamp w-32 h-32 rounded-full border-4 border-cinnabar/80 flex items-center justify-center bg-rice/10 backdrop-blur-sm">
        <div className="w-28 h-28 rounded-full border-2 border-cinnabar/40 flex items-center justify-center">
          <span className="font-brush text-3xl text-cinnabar/90 select-none">{text}</span>
        </div>
      </div>
    </div>
  );
};

/* ==================== 导航栏 ==================== */
const Navbar = ({ currentPage, setPage, user, onLogout }) => {
  const [menuOpen, setMenuOpen] = useState(false);
  const isAdmin = user && user.role === 'admin';
  const navItems = [
    { id: 'home', label: '首页' },
    { id: 'list', label: '春水雅集' },
    { id: 'wallet', label: '货栈' },
    ...(isAdmin ? [{ id: 'chlogs', label: '渠道报错' }, { id: 'pool', label: '号池监看' }] : []),
  ];
  return (
    <nav className="sticky top-0 z-50 bg-rice/80 backdrop-blur-md border-b border-tea-border">
      <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <button onClick={() => setPage('home')} className="flex items-center gap-3 group">
          <div className="relative w-10 h-10 flex items-center justify-center">
            <IconPavilion className="w-7 h-7 text-ink absolute" />
            <IconWine className="w-4 h-4 text-amber absolute -bottom-0.5 -right-0.5" />
          </div>
          <span className="font-brush text-2xl text-ink tracking-widest group-hover:text-amber transition-colors duration-500">醉翁亭</span>
        </button>

        <div className="hidden md:flex items-center gap-10">
          {navItems.map(item => (
            <button key={item.id} onClick={() => setPage(item.id)}
              className={`relative font-serif text-sm tracking-widest transition-colors duration-300 ${currentPage === item.id ? 'text-amber' : 'text-ink-light hover:text-ink'}`}>
              {item.label}
              {currentPage === item.id && <span className="absolute -bottom-1 left-0 w-full h-px bg-amber/60" />}
            </button>
          ))}
        </div>

        <div className="hidden md:flex items-center gap-5">
          {user ? (
            <>
              <span className="font-serif text-sm text-ink-light flex items-center gap-1.5">
                <IconCoin className="w-4 h-4 text-amber" />{fmt(user.balance)}
              </span>
              <div className="flex items-center gap-2">
                <span className="font-serif text-sm text-ink">{user.username}</span>
                <button onClick={onLogout} className="font-serif text-xs text-ink-light hover:text-cinnabar border border-tea-border px-3 py-1 tracking-widest">退栈</button>
              </div>
            </>
          ) : (
            <button onClick={() => setPage('login')} className="font-serif text-sm text-ink-light border border-tea-border px-5 py-1.5 tracking-widest hover:border-amber hover:text-amber transition-colors duration-300">
              登栈
            </button>
          )}
        </div>

        <button className="md:hidden p-2" onClick={() => setMenuOpen(!menuOpen)}>
          <div className="w-5 h-px bg-ink mb-1.5"></div>
          <div className="w-5 h-px bg-ink mb-1.5"></div>
          <div className="w-5 h-px bg-ink"></div>
        </button>
      </div>
      {menuOpen && (
        <div className="md:hidden border-t border-tea-border bg-rice/95 px-6 py-4 space-y-4 ink-fade">
          {navItems.map(item => (
            <button key={item.id} onClick={() => { setPage(item.id); setMenuOpen(false); }}
              className={`block w-full text-left font-serif text-base tracking-widest py-2 ${currentPage === item.id ? 'text-amber' : 'text-ink-light'}`}>
              {item.label}
            </button>
          ))}
          {user ? (
            <button onClick={() => { onLogout(); setMenuOpen(false); }} className="block w-full text-left font-serif text-sm text-cinnabar py-2 tracking-widest">退栈 ({user.username})</button>
          ) : (
            <button onClick={() => { setPage('login'); setMenuOpen(false); }} className="block w-full text-left font-serif text-sm text-amber py-2 tracking-widest">登栈</button>
          )}
        </div>
      )}
    </nav>
  );
};

/* ==================== 登录 / 注册 ==================== */
const LoginPage = ({ onAuthed }) => {
  const [mode, setMode] = useState('login');
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg('');
    try {
      if (mode === 'login') {
        const d = await api('POST', '/api/auth/login', { username, password });
        localStorage.setItem('zw_token', d.token);
        localStorage.setItem('zw_user', JSON.stringify(d.user));
        onAuthed(d.user);
      } else {
        await api('POST', '/api/auth/register', { username, password });
        setMode('login'); setMsg('注册成功，请登栈');
      }
    } catch (e) { setMsg(e.message); }
    setBusy(false);
  };

  return (
    <div className="page-enter max-w-md mx-auto px-6 py-16">
      <div className="text-center mb-10">
        <h2 className="font-brush text-4xl text-ink mb-3">{mode === 'login' ? '登栈' : '入亭'}</h2>
        <p className="font-serif text-sm text-ink-light tracking-widest">{mode === 'login' ? '有信物者，方入此门' : '注册一枚亭内信物'}</p>
      </div>
      <div className="bg-white/40 border border-tea-border p-8 relative">
        <div className="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-amber/20"></div>
        <div className="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-amber/20"></div>
        <div className="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-amber/20"></div>
        <div className="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-amber/20"></div>
        <div className="space-y-5">
          <div>
            <label className="block font-serif text-sm text-ink-light mb-2 tracking-widest">名号</label>
            <input value={username} onChange={e => setUsername(e.target.value)} placeholder="你的名号..." className="input-scroll w-full px-4 py-3 font-serif text-ink placeholder:text-ink-light/40" />
          </div>
          <div>
            <label className="block font-serif text-sm text-ink-light mb-2 tracking-widest">密语</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="口令（至少 6 位）" className="input-scroll w-full px-4 py-3 font-serif text-ink placeholder:text-ink-light/40" />
          </div>
          {msg && <p className="font-serif text-sm text-cinnabar">{msg}</p>}
          <button onClick={submit} disabled={busy}
            className="btn-seal w-full py-3.5 bg-amber text-white font-serif tracking-[0.3em] text-center hover:bg-amber/90 transition-colors duration-300 shadow-sm disabled:opacity-60">
            {busy ? '稍候...' : (mode === 'login' ? '登栈' : '注册')}
          </button>
          <button onClick={() => setMode(mode === 'login' ? 'register' : 'login')}
            className="w-full text-center font-serif text-sm text-ink-light hover:text-amber tracking-widest">
            {mode === 'login' ? '尚未入亭？注册一枚信物' : '已有信物？返回登栈'}
          </button>
        </div>
      </div>
    </div>
  );
};

              <path d="M0 600 L0 450 Q300 400 500 430 Q700 380 900 410 Q1100 360 1440 400 L1440 600 Z" fill="#3A3836" opacity="0.5"/>

            </svg>
          </div>
          <div className="absolute bottom-[20%] right-[8%] opacity-[0.06]">
            <svg width="120" height="140" viewBox="0 0 120 140">
              <path d="M10 60 L60 20 L110 60" fill="none" stroke="#2C2A28" strokeWidth="2"/>
              <rect x="30" y="60" width="60" height="60" fill="none" stroke="#2C2A28" strokeWidth="1.5"/>

        <div className="relative z-10 max-w-4xl mx-auto px-6 pt-20 md:pt-32 pb-20 text-center">

            <span className="h-px w-12 bg-amber/40"></span>
            <span className="font-serif text-lg md:text-xl text-ink-light tracking-[0.3em]">春水雅集</span>
            <span className="h-px w-12 bg-amber/40"></span>
          </div>
          <p className="font-serif text-base md:text-lg text-ink-light/80 mb-16 tracking-wider ink-fade" style={{animationDelay:'0.8s',opacity:0}}>
            醉翁之意不在酒，在乎春水花瓣之间也。
          </p>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 max-w-3xl mx-auto">
            <button onClick={() => setPage('list')} className="card-deckle bg-white/40 backdrop-blur-sm border border-tea-border p-8 text-center group ink-fade" style={{animationDelay:'1s',opacity:0}}>
              <div className="w-14 h-14 mx-auto mb-5 rounded-full border border-tea-border flex items-center justify-center group-hover:border-amber group-hover:bg-amber/5 transition-all duration-500">
                <IconScroll className="w-7 h-7 text-ink-light group-hover:text-amber transition-colors duration-500" />
              </div>
              <h3 className="font-brush text-2xl text-ink mb-2 group-hover:text-amber transition-colors duration-500">春水雅集</h3>
              <p className="font-serif text-sm text-ink-light tracking-widest">以代币购养好的春水号</p>

        {/* 号池一览 */}
        {stats && (
          <div className="page-enter">
            <h3 className="font-brush text-3xl text-ink mb-6">号池一览</h3>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              {[
                { label: '号池总量', value: stats.summary.total },
                { label: '在售号数', value: stats.summary.on_sale },
                { label: '已售号数', value: stats.summary.sold },
                { label: '今日签到', value: stats.summary.signed_today },

const ProductDetailPage = ({ id, setPage, user, onAuthed, onBuy }) => {
  const [info, setInfo] = useState(null);
  const [err, setErr] = useState('');
  const [seal, setSeal] = useState(null);
  const [delivered, setDelivered] = useState(null);

  useEffect(() => {
    const p = (user ? api('GET', '/api/products') : Promise.resolve({ products: [] }))
      .then(d => {
        const found = (d.products || []).find(x => x.id === Number(id));
        if (found) setInfo(found);
        else setErr('该号已售出或不存在');

      .catch(e => setErr(e.message));

/* ==================== 号池监看（管理端） ==================== */
const PoolAdminPage = () => {
  const [stats, setStats] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const [users, setUsers] = useState([]);
  const [q, setQ] = useState('');
  const [status, setStatus] = useState('');
  const [platform, setPlatform] = useState('');
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');
  const [chargeUid, setChargeUid] = useState('');
  const [chargeAmt, setChargeAmt] = useState('');

  const load = async () => {
    try {
      const sp = platform ? '?platform=' + encodeURIComponent(platform) : '';
      const s = await api('GET', '/api/admin/chunshui/stats' + sp);
      setStats(s);
      const params = new URLSearchParams();
      if (status) params.set('status', status);
      if (platform) params.set('platform', platform);
      if (q) params.set('q', q);
      const qs = params.toString();
      const d = await api('GET', '/api/admin/chunshui/accounts' + (qs ? '?' + qs : ''));
      setAccounts(d.accounts || []);
      const u = await api('GET', '/api/admin/users');
      setUsers(u.users || []);
      setErr('');
    } catch (e) { setErr(e.message); }
  };

  useEffect(() => { load(); }, [status, q, platform]);

  const platTabs = Array.from(new Set(['', ...Object.keys(PLATFORM_LABELS), ...accounts.map(a => a.platform || '')])).filter(Boolean);

  const patch = async (id, body) => {
    try { await api('PATCH', `/api/admin/chunshui/accounts/${id}`, body); setMsg('已更新'); load(); } catch (e) { setMsg(e.message); }
  };
  const patchUser = async (id, body) => {
    try { await api('PATCH', `/api/admin/users/${id}`, body); setMsg('用户已更新'); load(); } catch (e) { setMsg(e.message); }
  };
  const charge = async () => {
    try {
      const d = await api('POST', '/api/admin/charge', { user_id: Number(chargeUid), amount: Number(chargeAmt), note: '亭主充值' });
      setMsg(`充值成功，余额 ${d.balance} 枚`); setChargeUid(''); setChargeAmt('');
    } catch (e) { setMsg(e.message); }

  const card = (label, value, color) => (
    <div className="bg-white/40 border border-tea-border p-5">
      <p className="font-serif text-xs text-ink-light tracking-widest mb-1">{label}</p>
      <p className={`font-lora text-2xl font-semibold ${color || 'text-ink'}`}>{fmt(value)}</p>
    </div>

  return (
    <div className="page-enter max-w-6xl mx-auto px-6 py-10">
      <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">

          <h2 className="font-brush text-4xl text-ink mb-2">春水号池</h2>
          <p className="font-serif text-sm text-ink-light tracking-widest">监看全部春水号的健康与花瓣，向用户充值</p>
        </div>
        {msg && <p className="font-serif text-sm text-amber">{msg}</p>}
        {err && <p className="font-serif text-sm text-cinnabar">{err}</p>}
      </div>

      {stats && (
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
          {card('号池总数', stats.total)}
          {card('在售库存', stats.pool, 'text-amber')}
          {card('已售出', stats.sold)}
          {card('异常/掉线', stats.dead, stats.dead > 0 ? 'text-cinnabar' : 'text-ink')}
          {card('花瓣总和', stats.totalPetals, 'text-amber')}

                </td>
                <td className="px-4 py-3 text-center">
                  <span className={`px-2 py-0.5 text-xs border ${a.status === 'pool' ? 'border-amber/40 text-amber bg-amber/5' : a.status === 'sold' ? 'border-tea-border text-ink-light' : 'border-cinnabar/40 text-cinnabar'}`}>
                    {{ pool: '库存', sold: '已售', disabled: '停用' }[a.status] || a.status}
                  </span>
                </td>
                <td className="px-4 py-3 text-right">
                  {a.status === 'pool' ? (
                    <input type="number" defaultValue={a.price} onBlur={e => { const v = Number(e.target.value); if (v !== a.price) patch(a.id, { price: v }); }}
                      className="input-scroll w-20 px-2 py-1 font-lora text-right" />
                  ) : <span className="text-ink-light">{fmt(a.price)}</span>}
                </td>
                <td className="px-4 py-3 text-center whitespace-nowrap">
                  {a.status === 'pool' ? (
                    <button onClick={() => patch(a.id, { status: 'disabled' })} className="text-xs text-ink-light border border-tea-border px-2 py-1 hover:text-cinnabar hover:border-cinnabar/50 tracking-wider">停用</button>
                  ) : a.status === 'disabled' ? (
                    <button onClick={() => patch(a.id, { status: 'pool' })} className="text-xs text-amber border border-amber/40 px-2 py-1 tracking-wider">上架</button>
                  ) : <span className="text-ink-light text-xs">—</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        {accounts.length === 0 && <div className="px-6 py-12 text-center font-serif text-sm text-ink-light">无匹配账号</div>}
      </div>

      <div className="mt-8 bg-white/40 border border-tea-border p-6 max-w-lg">
        <h3 className="font-brush text-2xl text-ink mb-4">给用户充值代币</h3>
        <div className="flex gap-3 flex-wrap">
          <input value={chargeUid} onChange={e => setChargeUid(e.target.value)} placeholder="用户 ID" className="input-scroll px-4 py-2.5 font-serif w-32" />
          <input value={chargeAmt} onChange={e => setChargeAmt(e.target.value)} placeholder="代币数量" type="number" className="input-scroll px-4 py-2.5 font-serif w-36" />
          <button onClick={charge} className="px-6 py-2.5 bg-amber text-white font-serif text-sm tracking-widest hover:bg-amber/90">充值</button>
        </div>
        <p className="font-serif text-xs text-ink-light mt-4">新号入库：前往 GitHub 仓库 qingshanjiluo/zuiweng 手动触发 chunshui-register workflow。</p>
      </div>

      <div className="mt-10">
        <h3 className="font-brush text-3xl text-ink mb-4">用户管理</h3>
        <div className="bg-white/30 border border-tea-border overflow-x-auto">
          <table className="w-full text-sm font-serif">
            <thead>
              <tr className="border-b border-tea-border text-ink-light text-xs tracking-widest">
                <th className="px-4 py-3 text-left">ID</th>
                <th className="px-4 py-3 text-left">名号</th>
                <th className="px-4 py-3 text-center">身份</th>
                <th className="px-4 py-3 text-right">余钱</th>
                <th className="px-4 py-3 text-right">购号数</th>
                <th className="px-4 py-3 text-right">入亭</th>
                <th className="px-4 py-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-tea-border/50">
              {users.map(u => (
                <tr key={u.id} className="hover:bg-white/20 transition-colors">
                  <td className="px-4 py-3 text-ink-light">{u.id}</td>
                  <td className="px-4 py-3 text-ink">{u.username}</td>
                  <td className="px-4 py-3 text-center">
                    <span className={`px-2 py-0.5 text-xs border ${u.role === 'admin' ? 'border-cinnabar/40 text-cinnabar bg-cinnabar/5' : 'border-tea-border text-ink-light'}`}>
                      {u.role === 'admin' ? '管理员' : '游客'}
                    </span>
                  </td>
                  <td className="px-4 py-3 text-right">
                    <input type="number" defaultValue={u.balance} onBlur={e => { const v = Number(e.target.value); if (v !== u.balance) patchUser(u.id, { balance: v }); }}
                      className="input-scroll w-24 px-2 py-1 font-lora text-right" />
                  </td>
                  <td className="px-4 py-3 text-right text-ink">{u.purchased}</td>
                  <td className="px-4 py-3 text-right text-ink-light">{fmtTime(u.created_at)}</td>
                  <td className="px-4 py-3 text-center whitespace-nowrap">
                    {u.role === 'admin' ? (
                      <button onClick={() => patchUser(u.id, { role: 'user' })} className="text-xs text-ink-light border border-tea-border px-2 py-1 hover:text-cinnabar tracking-wider">降权</button>
                    ) : (
                      <button onClick={() => patchUser(u.id, { role: 'admin' })} className="text-xs text-cinnabar border border-cinnabar/40 px-2 py-1 hover:bg-cinnabar/5 tracking-wider">提权</button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {users.length === 0 && <div className="px-6 py-12 text-center font-serif text-sm text-ink-light">暂无用户</div>}
        </div>
      </div>
    </div>
  );
};

/* ==================== 渠道报错 (admin) ==================== */
const ChannelLogsAdminPage = () => {
  const [logs, setLogs] = useState([]);
  const [plat, setPlat] = useState('');
  const [err, setErr] = useState('');

  const load = () => {
    api('GET', '/api/admin/channel-logs' + (plat ? '?platform=' + encodeURIComponent(plat) : ''))
      .then(d => setLogs(d.logs || []))
      .catch(e => setErr(e.message));
  };
  useEffect(() => { load(); }, [plat]);

  return (
    <div className="page-enter max-w-6xl mx-auto px-6 py-10">
      <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
        <div>
          <h2 className="font-brush text-4xl text-ink mb-2">渠道报错</h2>
          <p className="font-serif text-sm text-ink-light tracking-widest">注册 / 签到 / 登录 失败的详细原因，由 GitHub Actions 实时上报</p>
        </div>
        <select value={plat} onChange={e => setPlat(e.target.value)}
          className="input-scroll px-4 py-2.5 font-serif">
          <option value="">全部平台</option>
          {Object.entries(PLATFORM_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
        </select>
      </div>
      {err && <p className="font-serif text-sm text-cinnabar mb-6">{err}</p>}
      <div className="bg-white/30 border border-tea-border overflow-x-auto">
        <table className="w-full text-sm font-serif">
          <thead>
            <tr className="border-b border-tea-border text-ink-light text-xs tracking-widest">
              <th className="px-4 py-3 text-left">平台</th>
              <th className="px-4 py-3 text-center">类型</th>
              <th className="px-4 py-3 text-left">报错详情</th>
              <th className="px-4 py-3 text-right">时间</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-tea-border/50">
            {logs.map(l => (
              <tr key={l.id} className="hover:bg-white/20 transition-colors align-top">
                <td className="px-4 py-3 whitespace-nowrap">{PLATFORM_LABELS[l.platform] || l.platform}</td>
                <td className="px-4 py-3 text-center whitespace-nowrap">
                  <span className={`px-2 py-0.5 text-xs border ${l.category === 'login' ? 'border-cinnabar/40 text-cinnabar bg-cinnabar/5' : 'border-tea-border text-ink-light'}`}>
                    {{ register: '注册', daily: '签到', login: '登录' }[l.category] || l.category}
                  </span>
                </td>
                <td className="px-4 py-3 text-ink break-all">{l.message}</td>
                <td className="px-4 py-3 text-right text-ink-light whitespace-nowrap">{fmtTime(l.created_at)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {logs.length === 0 && <div className="px-6 py-12 text-center font-serif text-sm text-ink-light">暂无报错记录</div>}
      </div>
    </div>
  );
};

/* ==================== App ==================== */
const App = () => {
  const [currentPage, setPage] = useState('home');
  const [pageParam, setPageParam] = useState(null);
  const [user, setUser] = useState(getUser());

  const go = (page, param) => { setPage(page); setPageParam(param); };
  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [currentPage]);

  const onAuthed = (u) => { setUser(u); refreshUser(); setPage('home'); };
  const onLogout = () => { localStorage.removeItem('zw_token'); localStorage.removeItem('zw_user'); setUser(null); setPage('home'); };
  const refreshUser = () => {
    if (getToken()) api('GET', '/api/wallet').then(d => { localStorage.setItem('zw_user', JSON.stringify(d.user)); setUser(d.user); }).catch(() => {});
  };

  const renderPage = () => {
    switch (currentPage) {
      case 'login': return <LoginPage onAuthed={onAuthed} />;
      case 'home': return <HomePage setPage={go} user={user} />;
      case 'list': return <ProductListPage setPage={go} user={user} onBuy={refreshUser} />;
      case 'detail': return <ProductDetailPage id={pageParam && pageParam.id} setPage={go} user={user} onBuy={refreshUser} />;
      case 'wallet': return <WalletPage user={user} setPage={go} />;
      case 'pool': return <PoolAdminPage />;
      case 'chlogs': return <ChannelLogsAdminPage />;
      default: return <HomePage setPage={go} user={user} />;
    }
  };

  return (
    <div className="min-h-screen flex flex-col">
      <Navbar currentPage={currentPage} setPage={go} user={user} onLogout={onLogout} />
      <main className="flex-1">{renderPage()}</main>
      <footer className="border-t border-tea-border mt-20 py-10 text-center">
        <div className="flex items-center justify-center gap-4 mb-4">
          <span className="h-px w-8 bg-amber/30"></span>
          <IconPavilion className="w-5 h-5 text-ink-light/40" />
          <span className="h-px w-8 bg-amber/30"></span>
        </div>
        <p className="font-serif text-xs text-ink-light/40 tracking-[0.2em]">醉翁亭 · 春水雅集 · GitHub Actions × Cloudflare D1</p>
      </footer>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
